name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (example: v2.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.vars.outputs.release_tag }}
      mod_version: ${{ steps.vars.outputs.mod_version }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build jars
        run: ./gradlew --no-daemon --stacktrace collectAllJars

      - name: export version vars
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${RELEASE_TAG}"
          mod_version="${release_tag#v}"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "mod_version=${mod_version}" >> "$GITHUB_OUTPUT"

      - name: publish github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: all-jars/*
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: upload all-jars artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-jars
          path: all-jars/

  modrinth:
    runs-on: ubuntu-24.04
    needs: release
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - '1.21.1'
          - '1.21.4'
          - '1.21.6'
          - '1.21.8'
          - '1.21.9'
          - '1.21.10'
          - '1.21.11'
    env:
      RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
      MOD_VERSION: ${{ needs.release.outputs.mod_version }}
      MOD_ID: playernamestyler
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID || secrets.MODRINTH_PROJECT_ID }}
    steps:
      - name: download all-jars artifact
        uses: actions/download-artifact@v4
        with:
          name: all-jars
          path: all-jars

      - name: debug Modrinth config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${MODRINTH_PROJECT_ID:-}" ]]; then
            echo "MODRINTH_PROJECT_ID: set (length=${#MODRINTH_PROJECT_ID})"
          else
            echo "MODRINTH_PROJECT_ID: NOT set (set repo variable MODRINTH_PROJECT_ID or secret MODRINTH_PROJECT_ID)"
          fi
          if [[ -n "${MODRINTH_TOKEN:-}" ]]; then
            echo "MODRINTH_TOKEN: set"
          else
            echo "MODRINTH_TOKEN: NOT set (set repo secret MODRINTH_TOKEN)"
          fi

      - name: publish to modrinth
        if: ${{ env.MODRINTH_TOKEN != '' && env.MODRINTH_PROJECT_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          modrinth-featured: ${{ matrix.minecraft == '1.21.11' }}

          name: PlayerName Styler ${{ env.MOD_VERSION }} (MC ${{ matrix.minecraft }})
          version: ${{ env.MOD_VERSION }}+mc${{ matrix.minecraft }}
          version-type: release
          changelog: |
            # 2.0.2 - Bug Fix & Feature
            - Fix nameplates vanishing the instant a nickname was set: freshly spawned name tags were wrongly treated as crash orphans and blocked from loading (issue #3)
            - Add an optional second nameplate line mirroring the scoreboard "below_name" display slot (e.g. health), which Minecraft otherwise hides once the name tag is replaced (issue #4)
            - New config option `showBelowName` (default true) to toggle the below-name line
            GitHub release: https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}

          loaders: |
            neoforge
          game-versions: |
            ${{ matrix.minecraft }}

          files: |
            all-jars/${{ env.MOD_ID }}-${{ env.MOD_VERSION }}-mc${{ matrix.minecraft }}.jar
            all-jars/${{ env.MOD_ID }}-${{ env.MOD_VERSION }}-mc${{ matrix.minecraft }}-sources.jar
