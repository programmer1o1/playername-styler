plugins {
    id 'dev.kikugie.stonecutter'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.lucko.me/' }
    maven { url = 'https://api.modrinth.com/maven' }
}

// Mojang ships Java 21 to end users in 1.21.4, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

java {
    withSourcesJar()
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    if (project.hasProperty('parchment_minecraft_version') && project.hasProperty('parchment_mappings_version')) {
        parchment {
            mappingsVersion = project.parchment_mappings_version
            minecraftVersion = project.parchment_minecraft_version
        }
    }

    runs {
        def mcVersionParts = (project.minecraft_version ?: "0.0.0").tokenize(".")
        def mcMajor = (mcVersionParts[0] ?: "0") as int
        def mcMinor = (mcVersionParts.size() > 1 ? mcVersionParts[1] : "0") as int
        def mcPatch = (mcVersionParts.size() > 2 ? mcVersionParts[2] : "0") as int
        def splitDataRuns = mcMajor > 1 || (mcMajor == 1 && (mcMinor > 21 || (mcMinor == 21 && mcPatch >= 4)))

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        if (splitDataRuns) {
            clientData {
                clientData()
                programArguments.addAll '--mod', project.mod_id, '--all',
                        '--output', rootProject.file('src/generated/resources/').getAbsolutePath(),
                        '--existing', rootProject.file('src/main/resources/').getAbsolutePath()
            }
        } else {
            data {
                data()
                programArguments.addAll '--mod', project.mod_id, '--all',
                        '--output', rootProject.file('src/generated/resources/').getAbsolutePath(),
                        '--existing', rootProject.file('src/main/resources/').getAbsolutePath()
            }
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

afterEvaluate {
    // Keep a stable task name across MC versions. MDG changed `data` -> `clientData`/`serverData` in 1.21.4+.
    if (tasks.findByName("prepareDataRun") == null) {
        def clientDataTask = tasks.findByName("prepareClientDataRun")
        if (clientDataTask != null) {
            tasks.register("prepareDataRun") { dependsOn clientDataTask }
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir rootProject.file('src/generated/resources') }

// Dev-only compatibility shim:
// LuckPerms (NeoForge) 5.4.150 targets early NeoForge 1.21.4 betas and references
// net.neoforged.neoforge.event.AddReloadListenerEvent (removed in newer NeoForge).
// We compile a minimal compatible class from src/neoforgeCompat/java and embed its bytecode as
// a resource, then define it at runtime into the NeoForge module before LuckPerms initializes.
def neoForgeCompatOutputDir = layout.buildDirectory.dir('neoforgeCompat/classes')

tasks.register('compileNeoForgeCompat', JavaCompile) {
    source(rootProject.fileTree('src/neoforgeCompat/java') { include '**/*.java' })
    classpath = sourceSets.main.compileClasspath
    destinationDirectory.set(neoForgeCompatOutputDir)
    options.encoding = 'UTF-8'
    // Ensure the embedded shim class is compatible with Minecraft's Java 21 runtime,
    // regardless of what JDK happens to be running Gradle.
    options.release.set(21)
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('compileNeoForgeCompat')
    from(neoForgeCompatOutputDir) {
        include 'net/neoforged/neoforge/event/AddReloadListenerEvent.class'
        eachFile { details -> details.path = 'playernamestyler/compat/AddReloadListenerEvent.class' }
        includeEmptyDirs = false
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "net.luckperms:api:5.4"
    if (project.hasProperty('luckperms_modrinth_version') && project.luckperms_modrinth_version) {
        localRuntime "maven.modrinth:luckperms:${project.luckperms_modrinth_version}"
    }
    // BedSheet (NeoForge Carpet port) — dev-only, for spawning fake players while testing
    // nameplates. Only published for some MC versions, so gated on a per-version property.
    if (project.hasProperty('bedsheet_modrinth_version') && project.bedsheet_modrinth_version) {
        localRuntime "maven.modrinth:bedsheet:${project.bedsheet_modrinth_version}"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from rootProject.file("src/main/templates")
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

if (project == rootProject) {
    def versionProjects = [
            'v1_21_1',
            'v1_21_4',
            'v1_21_6',
            'v1_21_8',
            'v1_21_9',
            'v1_21_10',
            'v1_21_11',
    ]

    tasks.register('buildAllVersions') {
        group = 'build'
        description = 'Builds all supported Minecraft versions.'
        dependsOn versionProjects.collect { ":${it}:build" }
    }

    tasks.register('collectAllJars') {
        group = 'build'
        description = 'Builds all version jars and collects them into ./all-jars/'

        dependsOn versionProjects.collect { ":${it}:jar" }
        dependsOn versionProjects.collect { ":${it}:sourcesJar" }

        doLast {
            def outDir = rootProject.file('all-jars')
            delete(outDir)
            outDir.mkdirs()

            versionProjects.each { projName ->
                def p = rootProject.project(":${projName}")
                def mc = (p.findProperty('minecraft_version') ?: projName).toString()

                ['jar', 'sourcesJar'].each { taskName ->
                    def t = p.tasks.findByName(taskName)
                    if (t == null) {
                        return
                    }
                    def f = t.archiveFile.get().asFile
                    def classifier = t.archiveClassifier.getOrNull()
                    def ext = t.archiveExtension.getOrNull() ?: 'jar'
                    def outName = "${rootProject.mod_id}-${rootProject.mod_version}-mc${mc}" + (classifier ? "-${classifier}" : "") + ".${ext}"

                    copy {
                        from(f)
                        into(outDir)
                        rename { outName }
                    }
                }
            }
        }
    }
}
